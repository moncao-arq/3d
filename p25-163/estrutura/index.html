<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#ECEEF0;--panel:#FFFFFF;--fg:#1D2329;--muted:#5E6872;--line:#D3D8DD;--accent:#8C8C8C;--acc-fg:#FFFFFF;
 --f-disp:"Archivo",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15191D;--panel:#1F252B;--fg:#E7EBEE;--muted:#9AA4AD;--line:#323A42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191D;--panel:#1F252B;--fg:#E7EBEE;--muted:#9AA4AD;--line:#323A42;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-disp);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.tag{background:var(--accent);color:var(--acc-fg);font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 8px}
h1{font-size:17px;margin:0;font-weight:800}
.sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.views{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:600 12.5px var(--f-disp);color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--fg)} button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
canvas{display:block}
.panel{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:260px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box}
.panel.closed>*:not(.ph){display:none}
.ph{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.layer{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:3px 0;user-select:none}
.sw{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:none}
.levels{display:flex;flex-wrap:wrap;gap:4px}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-family:var(--f-mono);font-size:12px}
.stats span:nth-child(odd){color:var(--muted)}
#info{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;max-width:min(330px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);padding:10px 12px;font-size:13px}
#info b{display:block;font-size:14px} #info p{margin:4px 0 0;color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:pre-line}
</style>
</head>
