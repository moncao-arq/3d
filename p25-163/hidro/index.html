<style>
:root{--bg:#ECEEF0;--panel:#FFFFFF;--fg:#1D2329;--muted:#5E6872;--line:#D3D8DD;--accent:#7CC6EE;--acc-fg:#1D2329;
 --f-disp:"Archivo",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15191D;--panel:#1F252B;--fg:#E7EBEE;--muted:#9AA4AD;--line:#323A42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191D;--panel:#1F252B;--fg:#E7EBEE;--muted:#9AA4AD;--line:#323A42;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-disp);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.tag{background:var(--accent);color:var(--acc-fg);font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 8px}
h1{font-size:17px;margin:0;font-weight:800}
.sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.views{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:600 12.5px var(--f-disp);color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--fg)} button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
canvas{display:block}
.panel{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:260px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box}
.panel.closed>*:not(.ph){display:none}
.ph{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.layer{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:3px 0;user-select:none}
.sw{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:none}
.levels{display:flex;flex-wrap:wrap;gap:4px}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-family:var(--f-mono);font-size:12px}
.stats span:nth-child(odd){color:var(--muted)}
#info{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;max-width:min(330px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);padding:10px 12px;font-size:13px}
#info b{display:block;font-size:14px} #info p{margin:4px 0 0;color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:pre-line}
</style>
</head>

CATS.forEach(([k,lab,col])=>{mats[k]=new THREE.MeshLambertMaterial({color:new THREE.Color(col)})});
D.items.forEach(it=>{
  let m;
  if(it.t==='pt'){const g=it.shape==='box'?new THREE.BoxGeometry(it.s[0],it.s[1],it.s[2]):new THREE.SphereGeometry(it.r||.09,14,10);
    m=new THREE.Mesh(g,mats[it.c]); m.position.set(...it.p);}
  else if(it.t==='box'){const g=new THREE.BoxGeometry(Math.max(it.s[0],.02),Math.max(it.s[1],.02),Math.max(it.s[2],.02)); m=new THREE.Mesh(g,mats[it.c]); m.position.set(...it.p);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x1d2329,transparent:true,opacity:.35})));}
  else if(it.t==='ln'){const path=new THREE.CatmullRomCurve3(it.pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',0.05);
    m=new THREE.Mesh(new THREE.TubeGeometry(path,Math.max(8,it.pts.length*6),it.r||.025,6,false),mats[it.c]);}
  else if(it.t==='cyl'){const g=new THREE.CylinderGeometry(it.r,it.r,it.h,20); m=new THREE.Mesh(g,mats[it.c]); m.position.set(...it.p);}
  m.userData={cat:it.c,lv:it.lv,nome:it.n||'',info:it.i||''}; scene.add(m); objs.push(m); if(it.n) pick.push(m);
});
const vis={arq:true}; CATS.forEach(c=>vis[c[0]]=true); let level='all';
const ORDER={inf:0,ter:1,sup:2,all:9};
function apply(){objs.forEach(m=>{const u=m.userData;let on=vis[u.cat];if(level!=='all'&&u.lv!=='all') on=on&&ORDER[u.lv]<=ORDER[level]&&(u.cat!=='arq'||ORDER[u.lv]<ORDER[level]||true);
  if(level!=='all'&&u.cat!=='arq'&&u.lv!=='all') on=on&&u.lv===level; m.visible=on})}
const Ld=document.getElementById('layers');
[['arq','Arquitetura (translúcida)','#cfd3d7'],...CATS].forEach(([k,lab,col])=>{const row=document.createElement('label');row.className='layer';
  row.innerHTML=`<input type="checkbox" checked><span class="sw" style="background:${col}"></span>${lab}`;
  row.querySelector('input').addEventListener('change',e=>{vis[k]=e.target.checked;apply()});Ld.appendChild(row)});
const LVd=document.getElementById('levels');
[['all','Tudo'],['inf','Inferior'],['ter','Térreo'],['sup','1º pav.']].forEach(([k,lab])=>{const b=document.createElement('button');b.textContent=lab;b.setAttribute('aria-pressed',k==='all');
  b.onclick=()=>{level=k;[...LVd.children].forEach(x=>x.setAttribute('aria-pressed',x===b));apply()};LVd.appendChild(b)});
document.getElementById('stats').innerHTML=D.stats.map(([a,b])=>`<span>${a}</span><span>${b}</span>`).join('');
const T=new THREE.Vector3(matchMedia('(max-width:640px)').matches?0:-3.5,1.0,2);
const VIEWS={iso:[-22,16,-22],front:[0,5,-34],back:[4,4,36],top:[T.x,48,2.05]};
function view(k){camera.position.set(...VIEWS[k]);controls.target.copy(T);controls.update();
  Object.keys(VIEWS).forEach(x=>document.getElementById('v-'+x).setAttribute('aria-pressed',x===k))}
Object.keys(VIEWS).forEach(k=>document.getElementById('v-'+k).onclick=()=>view(k)); view('iso');
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let sel=null,selMat=null,down=null;const hi=new THREE.MeshLambertMaterial({color:0xff2d55});const info=document.getElementById('info');
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  const rc=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rc.left)/rc.width)*2-1;mouse.y=-((e.clientY-rc.top)/rc.height)*2+1;ray.setFromCamera(mouse,camera);
  ray.params.Line={threshold:.1};const hit=ray.intersectObjects(pick.filter(m=>m.visible),false)[0];
  if(sel){sel.material=selMat;sel=null}
  if(hit){sel=hit.object;selMat=sel.material;sel.material=hi;info.innerHTML=`<b>${sel.userData.nome}</b><p>${sel.userData.info}</p>`}});
document.getElementById('tg').onclick=e=>{const p=document.getElementById('panel');p.classList.toggle('closed');const c=p.classList.contains('closed');e.target.textContent=c?'Camadas':'Ocultar';e.target.setAttribute('aria-expanded',!c)};
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setClearColor(new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()))}
addEventListener('resize',size);size(); if(matchMedia('(max-width:640px)').matches)document.getElementById('tg').click();
(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script>
</body>
</html>
